name: Daten aktualisieren
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Feeds und Kurse abrufen
        run: node scripts/fetch-data.mjs
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "kursradar-bot"
          git config user.email "kursradar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -q -m "Daten: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin main
          git push -q
